<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Wall | To Decompress </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* =========================
1. COLORS & GLOBAL RULES
========================== */
:root {
--cream: #fff9ed;
--cream-dark: #f3eadb;
--green-dark: #075b46;
--green: #0d7055;
--green-soft: #6fae99;
--gold: #f2a23a;
--brown: #c58a4a;
--orange: #f7941d;
--blue: #2e6b62;
--white: #ffffff;

--card-radius: 28px;
--card-shadow: 0 15px 35px rgba(7, 91, 70, .12),
0 4px 12px rgba(7, 91, 70, .06);
--page-width: 100%;}

*,
*::before,
*::after {
box-sizing: border-box;
}

html {
min-height: 100%;
scroll-behavior: smooth;
}

body {
min-width: 320px;
min-height: 100vh;
margin: 0;
overflow-x: hidden;
background: var(--cream);
color: var(--green-dark);
font-family: "Tajawal", sans-serif;
}

body.is-locked {
overflow: hidden;
touch-action: none;
}

button {
font: inherit;
}

button:focus-visible,
.flash-card:focus-visible {
outline: 3px solid var(--orange);
outline-offset: 4px;
}

/* =========================
2. DECORATIVE BACKGROUND
========================== */
.background-design {
position: fixed;
inset: 0;
z-index: -1;
overflow: hidden;
pointer-events: none;
background:
radial-gradient(circle at 10% 15%, rgba(111,174,153,.16), transparent 25%),
radial-gradient(circle at 90% 85%, rgba(242,162,58,.14), transparent 28%),
var(--cream);
}

.polygon {
position: absolute;
border-radius: 40px;
}

.p1 {
top: -100px;
right: -90px;
width: 360px;
height: 360px;
background: rgba(111,174,153,.16);
clip-path: polygon(30% 0, 100% 0, 100% 70%, 65% 100%, 0 45%);
transform: rotate(8deg);
}

.p2 {
top: 20%;
left: -150px;
width: 330px;
height: 330px;
background: rgba(242,162,58,.12);
clip-path: polygon(0 20%, 70% 0, 100% 65%, 35% 100%);
transform: rotate(-12deg);
}

.p3 {
bottom: -130px;
left: 15%;
width: 350px;
height: 350px;
background: rgba(111,174,153,.11);
clip-path: polygon(20% 0, 100% 35%, 75% 100%, 0 70%);
}

.p4 {
right: -80px;
bottom: -120px;
width: 330px;
height: 330px;
background: rgba(242,162,58,.11);
clip-path: polygon(0 30%, 55% 0, 100% 45%, 70% 100%, 15% 80%);
}

.topographic-lines {
position: absolute;
width: 700px;
height: 700px;
border: 1px solid rgba(7,91,70,.07);
border-radius: 48% 52% 55% 45%;
}

.line1 { top: -280px; left: -180px; transform: rotate(-18deg); }
.line2 { top: -245px; left: -145px; transform: rotate(-18deg) scale(.88); }
.line3 { top: -210px; left: -110px; transform: rotate(-18deg) scale(.76); }
.line4 { right: -180px; bottom: -300px; transform: rotate(28deg); }
.line5 { right: -145px; bottom: -265px; transform: rotate(28deg) scale(.88); }
.line6 { right: -110px; bottom: -230px; transform: rotate(28deg) scale(.76); }

.dots-pattern {
position: absolute;
top: 14%;
right: 7%;
width: 90px;
height: 90px;
opacity: .45;
background-image: radial-gradient(rgba(7,91,70,.12) 1.5px, transparent 1.5px);
background-size: 15px 15px;
}

/* =========================
3. PAGE & HEADER
========================== */
.page {
display: flex;
min-height: 100vh;
flex-direction: column;
align-items: center;
padding: 40px 6vw 0;
}

.top-controls,
.intro,
.cards-grid {
width: 100%;
max-width: var(--page-width);
}

.top-controls {
display: flex;
justify-content: flex-end;
align-items: center;
margin-bottom: 30px;
}

.reset-btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 9px;
padding: 11px 18px;
border: 0;
border-radius: 50px;
background: var(--green-dark);
color: var(--white);
box-shadow: 0 8px 22px rgba(7,91,70,.15);
cursor: pointer;
font-family: "Almarai", sans-serif;
font-size: 12px;
font-weight: 700;
transition: transform .3s ease, background .3s ease, box-shadow .3s ease;
}

.reset-btn:hover {
transform: translateY(-3px);
background: var(--green);
}

.intro {
margin-bottom: 45px;
text-align: center;
}

.intro-label {
display: inline-flex;
align-items: center;
gap: 9px;
margin-bottom: 18px;
padding: 8px 17px;
border: 1px solid rgba(13,112,85,.15);
border-radius: 50px;
background: rgba(255,255,255,.6);
color: var(--green);
box-shadow: 0 5px 20px rgba(7,91,70,.04);
font-family: "Almarai", sans-serif;
font-size: 12px;
font-weight: 700;
}

.intro-label i {
color: var(--orange);
font-size: 11px;
}

.intro h1 {
margin: 0 0 12px;
color: var(--green-dark);
font-family: "Almarai", sans-serif;
font-size: clamp(30px, 5vw, 52px);
font-weight: 800;
line-height: 1.2;
}

.intro p {
max-width: 620px;
margin: 0 auto;
color: rgba(7,91,70,.72);
font-size: clamp(13px, 1.5vw, 16px);
line-height: 1.9;
}

/* =========================
4. FLASH CARD GRID
========================== */
.cards-grid {
display: grid;
grid-template-columns: repeat(5, minmax(0, 1fr));
gap: 14px;
align-items: stretch;
}

.flash-card {
position: relative;
min-width: 0;
height: 350px;
perspective: 1400px;
-webkit-perspective: 1400px;
cursor: pointer;
transition: transform .35s ease, opacity .35s ease;
-webkit-tap-highlight-color: transparent;
}

.flash-card:not(.completed):not(.focused):hover {
transform: translateY(-5px);
}

.card-inner {
position: relative;
width: 100%;
height: 100%;
transform-style: preserve-3d;
-webkit-transform-style: preserve-3d;
transition: transform .75s cubic-bezier(.4, 0, .2, 1);
}

.flash-card.flipped .card-inner {
transform: rotateY(180deg);
-webkit-transform: rotateY(180deg);
}

.card-face {
position: absolute;
inset: 0;
display: flex;
width: 100%;
height: 100%;
overflow: hidden;
flex-direction: column;
border-radius: var(--card-radius);
box-shadow: var(--card-shadow);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
isolation: isolate;
}

/* =========================
5. SHARED CARD DECORATION
========================== */
.card-decoration {
position: absolute;
inset: 0;
z-index: 2;
overflow: hidden;
opacity: .55;
pointer-events: none;
}

.geo-line {
position: absolute;
border: 1px solid rgba(255,255,255,.35);
border-radius: 48% 52% 45% 55%;
pointer-events: none;
}

.geo-line.one {
top: -110px;
right: -130px;
width: 390px;
height: 280px;
transform: rotate(18deg);
}

.geo-line.two {
top: -85px;
right: -100px;
width: 330px;
height: 235px;
transform: rotate(18deg);
}

.geo-line.three {
top: -60px;
right: -70px;
width: 270px;
height: 190px;
transform: rotate(18deg);
}

.geo-line.four {
bottom: -120px;
left: -130px;
width: 340px;
height: 240px;
transform: rotate(-20deg);
}

.geo-line.five {
bottom: -95px;
left: -100px;
width: 285px;
height: 200px;
transform: rotate(-20deg);
}

/* =========================
6. FRONT OF THE CARD
========================== */
.card-front {
background: linear-gradient(145deg, var(--green-dark), var(--green));
color: var(--white);
}

.card-number {
position: absolute;
top: 25px;
left: 50%;
z-index: 3;
display: grid;
width: 44px;
height: 44px;
place-items: center;
border: 1px solid rgba(255,255,255,.3);
border-radius: 14px;
background: rgba(247,148,29,.92);
box-shadow: 0 7px 20px rgba(0,0,0,.1);
color: var(--white);
font-family: "Almarai", sans-serif;
font-size: 13px;
font-weight: 800;
transform: translateX(-50%);
-webkit-backdrop-filter: blur(7px);
backdrop-filter: blur(7px);
}

.card-question {
position: relative;
z-index: 3;
display: flex;
width: 100%;
height: 100%;
align-items: center;
justify-content: center;
margin: 0;
padding: 88px 24px 78px;
color: var(--white);
font-family: "Almarai", sans-serif;
font-size: clamp(15px, 1.35vw, 18px);
font-weight: 700;
line-height: 1.6;
text-align: center;
overflow-wrap: anywhere;
text-wrap: pretty;
text-shadow: 0 3px 15px rgba(0,0,0,.25);
}

.card-arrow {
position: absolute;
bottom: 22px;
left: 22px;
z-index: 4;
display: grid;
width: 38px;
height: 38px;
place-items: center;
border: 1px solid rgba(255,255,255,.25);
border-radius: 50%;
background: rgba(247,148,29,.88);
color: var(--white);
font-size: 12px;
pointer-events: none;
transition: transform .35s ease, background .35s ease;
}

.flash-card:not(.completed):not(.focused):hover .card-arrow {
transform: translateX(-5px);
background: var(--orange);
}

/* =========================
7. BACK OF THE CARD
========================== */
.card-back {
justify-content: center;
padding: 28px;
background: linear-gradient(145deg, var(--green-dark), var(--green));
color: var(--white);
transform: rotateY(180deg);
-webkit-transform: rotateY(180deg);
}

.back-overlay {
position: absolute;
inset: 0;
z-index: 1;
background: linear-gradient(180deg, rgba(7,91,70,.84), rgba(3,42,32,.94));
pointer-events: none;
}

.answer-content {
position: relative;
z-index: 3;
display: flex;
width: 100%;
height: 100%;
min-height: 0;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 12px 8px 62px;
text-align: center;
}

.answer-icon {
display: grid;
width: 58px;
height: 58px;
flex: 0 0 auto;
place-items: center;
margin-bottom: 18px;
border: 1px solid rgba(255,255,255,.2);
border-radius: 18px;
background: rgba(255,255,255,.12);
color: var(--white);
font-size: 20px;
}

.answer-content h2 {
margin: 0 0 12px;
color: var(--orange);
font-family: "Almarai", sans-serif;
font-size: clamp(28px, 2.8vw, 38px);
font-weight: 800;
line-height: 1.3;
overflow-wrap: anywhere;
}

.answer-content p {
max-width: 100%;
margin: 0;
color: rgba(255,255,255,.9);
font-size: clamp(19px, 1.8vw, 25px);
line-height: 1.7;
overflow-wrap: anywhere;
}

.done-button {
position: absolute;
bottom: 0;
left: 50%;
z-index: 4;
min-width: 120px;
padding: 12px 28px;
border: 0;
border-radius: 50px;
background: var(--white);
box-shadow: 0 8px 25px rgba(0,0,0,.18);
color: var(--green-dark);
cursor: pointer;
font-family: "Almarai", sans-serif;
font-size: 12px;
font-weight: 800;
transform: translateX(-50%);
transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
touch-action: manipulation;
}

.done-button:hover {
background: var(--cream);
box-shadow: 0 12px 30px rgba(0,0,0,.25);
transform: translate(-50%, -3px);
}

/* =========================
8. OPEN / FOCUSED CARD
========================== */
.focus-overlay {
position: fixed;
inset: 0;
z-index: 900;
background: rgba(3,42,32,.62);
opacity: 0;
visibility: hidden;
pointer-events: none;
-webkit-backdrop-filter: blur(4px);
backdrop-filter: blur(4px);
transition: opacity .3s ease, visibility .3s ease;
}

.focus-overlay.active {
opacity: 1;
visibility: visible;
pointer-events: auto;
}

.flash-card.focused {
position: fixed;
top: 50%;
left: 50%;
z-index: 1000;
width: min(400px, calc(100vw - 40px));
height: min(620px, calc(100vh - 48px));
height: min(620px, calc(100dvh - 48px));
margin: 0;
cursor: default;
transform: translate(-50%, -50%);
-webkit-transform: translate(-50%, -50%);
}

.flash-card.focused:hover {
transform: translate(-50%, -50%);
-webkit-transform: translate(-50%, -50%);
}

.flash-card.completed {
opacity: .72;
cursor: default;
transform: none !important;
}

.flash-card.completed .done-button {
display: none;
}

.flash-card.completed .card-front {
filter: saturate(.7);
}

.flash-card.completed::after {
position: absolute;
top: 18px;
left: 18px;
z-index: 10;
display: grid;
width: 38px;
height: 38px;
place-items: center;
border-radius: 50%;
background: rgba(255,255,255,.94);
box-shadow: 0 6px 18px rgba(0,0,0,.12);
color: var(--green);
content: "✓";
font-size: 15px;
font-weight: 800;
pointer-events: none;
}

/* =========================
9. FOOTER
========================== */
.site-footer {
width: calc(100% + 12vw);
align-self: stretch;
margin-left: -6vw;
margin-right: -6vw;
margin-top: 90px;
padding: 34px 6vw 36px;

background: var(--green-dark);
color: rgba(255,255,255,.78);
border-top: 1px solid rgba(255,255,255,.08);
box-shadow: 0 -8px 25px rgba(7,91,70,.08);
flex-shrink: 0;
}
.footer-inner {
display: flex;
width: min(1200px, 88vw);
flex-direction: column;
align-items: center;
gap: 8px;
margin: 0 auto;
font-family: "Almarai", sans-serif;
font-size: 10px;
font-weight: 600;
line-height: 1.6;
text-align: center;
}

.footer-brand {
color: var(--gold);
font-size: 13px;
font-weight: 800;
letter-spacing: .3px;
}

.footer-center {
color: rgba(255,255,255,.9);
font-size: 11px;
font-weight: 700;
}

.footer-designed { color: rgba(255,255,255,.68); font-size: 10px; }
.footer-right { color: rgba(255,255,255,.62); font-size: 9px; }

/* =========================
10. RESPONSIVE LAYOUT
========================== */
@media (max-width: 900px) {
.cards-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));

}

.flash-card {

}

.card-question {

@media (max-width: 600px) {

}

}

}

.flash-card {

}

.flash-card.focused {

}

.card-question {

}

.card-back {

}

.answer-content {

}

.answer-content h2 {

.site-footer {

.footer-brand { font-size: 11px; }

@media (prefers-reduced-motion: reduce) {

*::before,
*::after {
scroll-behavior: auto !important;
transition-duration: .01ms !important;

</style>

<body>
<!-- Decorative background -->
<div class="background-design" aria-hidden="true">
<div class="polygon p1"></div>
<div class="polygon p2"></div>
<div class="polygon p3"></div>
<div class="polygon p4"></div>
<div class="topographic-lines line1"></div>
<div class="topographic-lines line2"></div>
<div class="topographic-lines line3"></div>
<div class="topographic-lines line4"></div>
<div class="topographic-lines line5"></div>
<div class="topographic-lines line6"></div>
<div class="dots-pattern"></div>
</div>

<div class="focus-overlay" id="focusOverlay" aria-hidden="true"></div>

<main class="page">
<div class="top-controls">
<button class="reset-btn" id="resetButton" type="button">
<i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
Reset
</button>
</div>

<section class="intro">
<div class="intro-label">
<i class="fa-solid fa-mountain" aria-hidden="true"></i>
Vocabulary Wall
</div>
<h1>HOW TO DECOMPRESS</h1>
<p>Expanding your vocabulary, and knowing how to make meaning of an unfamiliar word by using the context given.</p>
</section>

<!-- Cards are generated from the CARDS array in JavaScript.
To edit the activity, change the question, word, or meaning there. -->
<section class="cards-grid" id="cardsGrid" aria-label="Vocabulary flash cards"></section>

<footer class="site-footer">
<div class="footer-inner">
<div class="footer-brand">Saudi Geology Club</div>
<div class="footer-center">Speaking Center</div>
<div class="footer-designed">Designed &amp; Developed by Retal Abdulmannan</div>
<div class="footer-right">© 2026 All Rights Reserved.</div>
</div>
</footer>
</main>


<script>
"use strict";

/* =========================================
1. EDIT CARD CONTENT HERE
Add, remove, or edit cards in this array.
========================================== */
const CARDS = [
{
question: "The upcoming vacation is mostly used to DECOMPRESS and recover after the midterms and projects.",
word: "Decompress",
meaning: "To release from pressure."
},
{
question: "I took a DOZE after my lectures so I can get started on my assignments while fully rested.",
word: "Doze",
meaning: "A short sleep."
},
{
question: "With the midterms FINALIZE, I have time to pick up where I left off on the TV show I started.",
word: "Finalize",
meaning: "To complete."
},
{
question: "The convenience of breaks is not only for students to rest up, but to also CONSERVE their passion after the rough midterm season.",
word: "Conserve",
meaning: "To keep."
},
{
question: "Deep breathing exercises trigger the REST-AND-DIGEST response to release stress.",
word: "Rest-and-Digest",
meaning: "A system that recovers the body during calm states."
}
];

/* =========================================
2. ELEMENTS & SAVED PROGRESS
========================================== */
const STORAGE_KEY = "vocabularyWallCompletedCards";
const cardsGrid = document.getElementById("cardsGrid");
const focusOverlay = document.getElementById("focusOverlay");
const resetButton = document.getElementById("resetButton");

let completedCards = loadCompletedCards();
let activeCard = null;

function loadCompletedCards() {
try {
const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
return Array.isArray(saved)
? saved.filter(index => Number.isInteger(index) && index >= 0 && index < CARDS.length)
: [];
} catch (error) {
return [];
}
}

function saveProgress() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(completedCards));
} catch (error) {
// The activity still works if browser storage is unavailable.
}
}

/* =========================================
3. CARD HTML
One reusable template prevents duplicated markup.
========================================== */
function createCard(cardData, index) {
const card = document.createElement("article");
card.className = "flash-card";
card.dataset.index = String(index);
card.tabIndex = 0;
card.setAttribute("role", "button");
card.setAttribute("aria-label", `Vocabulary card ${index + 1}: ${cardData.word}`);
card.setAttribute("aria-pressed", "false");

card.innerHTML = `
<div class="card-inner">
<div class="card-face card-front">
<div class="card-decoration" aria-hidden="true">
<span class="geo-line one"></span>
<span class="geo-line two"></span>
<span class="geo-line three"></span>
<span class="geo-line four"></span>
<span class="geo-line five"></span>
</div>
<span class="card-number">${String(index + 1).padStart(2, "0")}</span>
<h2 class="card-question"></h2>
<span class="card-arrow" aria-hidden="true">
<i class="fa-solid fa-arrow-left"></i>
</span>
</div>

<div class="card-face card-back">
<div class="back-overlay" aria-hidden="true"></div>
<div class="card-decoration" aria-hidden="true">
<span class="geo-line one"></span>
<span class="geo-line two"></span>
<span class="geo-line three"></span>
<span class="geo-line four"></span>
<span class="geo-line five"></span>
</div>
<div class="answer-content">
<div class="answer-icon" aria-hidden="true">
<i class="fa-solid fa-book-open"></i>
</div>
<h2></h2>
<p></p>
<button class="done-button" type="button">DONE</button>
</div>
</div>
</div>
`;

// Use textContent so edited card text is inserted safely.
card.querySelector(".card-question").textContent = cardData.question;
card.querySelector(".answer-content h2").textContent = cardData.word;
card.querySelector(".answer-content p").textContent = cardData.meaning;

if (completedCards.includes(index)) {
card.classList.add("completed", "flipped");
card.setAttribute("aria-pressed", "true");
}

return card;
}

function renderCards() {
const fragment = document.createDocumentFragment();

CARDS.forEach((cardData, index) => {
fragment.appendChild(createCard(cardData, index));
});

cardsGrid.replaceChildren(fragment);
}

/* =========================================
4. OPEN & FLIP
The same card is enlarged and flipped on
desktop, tablet, and mobile. No clones.
========================================== */
function openCard(card) {
if (!card || activeCard || card.classList.contains("completed")) return;

activeCard = card;
document.body.classList.add("is-locked");
focusOverlay.classList.add("active");

// Focus first, then flip so the animation is visible.
card.classList.add("focused");
card.setAttribute("aria-pressed", "true");

requestAnimationFrame(() => {
requestAnimationFrame(() => {
if (activeCard === card) {
card.classList.add("flipped");
}
});
});
}

/* =========================================
5. DONE
Return the same card to its grid position
while keeping its answer side visible.
========================================== */
function completeCard(card) {
if (!card || card !== activeCard) return;

const index = Number(card.dataset.index);

if (!completedCards.includes(index)) {
completedCards.push(index);
}

saveProgress();

// Keep .flipped; remove only the enlarged/focused state.
card.classList.add("completed");
card.classList.remove("focused");
card.setAttribute("aria-pressed", "true");

activeCard = null;
focusOverlay.classList.remove("active");
document.body.classList.remove("is-locked");
}

/* =========================================
6. RESET
========================================== */
function resetCards() {
completedCards = [];
saveProgress();

if (activeCard) {
activeCard.classList.remove("focused", "flipped");
activeCard.setAttribute("aria-pressed", "false");
activeCard = null;
}

focusOverlay.classList.remove("active");
document.body.classList.remove("is-locked");

cardsGrid.querySelectorAll(".flash-card").forEach(card => {
card.classList.remove("completed", "focused", "flipped");
card.setAttribute("aria-pressed", "false");
});
}

/* =========================================
7. EVENTS
========================================== */
cardsGrid.addEventListener("click", event => {
const doneButton = event.target.closest(".done-button");

if (doneButton) {
event.preventDefault();
event.stopPropagation();
completeCard(doneButton.closest(".flash-card"));
return;
}

const card = event.target.closest(".flash-card");
if (card) openCard(card);
});

cardsGrid.addEventListener("keydown", event => {
const card = event.target.closest(".flash-card");

if (!card || event.target !== card) return;

if (event.key === "Enter" || event.key === " ") {
event.preventDefault();
openCard(card);
}
});

focusOverlay.addEventListener("click", () => {
// Intentionally do not close the card by clicking outside.
// The DONE button is the clear completion action.
});

resetButton.addEventListener("click", resetCards);

/* =========================================
8. START
========================================== */
renderCards();
</script>
</body>
</html>
