<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary WALL | Back On Track</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
--cream:#fff9ed;
--cream-dark:#f3eadb;
--green-dark:#075b46;
--green:#0d7055;
--green-soft:#6fae99;
--gold:#f2a23a;
--brown:#c58a4a;
--orange:#f7941d;
--blue:#2e6b62;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
margin:0;
font-family:"Tajawal",sans-serif;
background:var(--cream);
color:var(--green-dark);
overflow-x:hidden;
}

button{
font-family:"Almarai",sans-serif;
}


/* ========================================
BACKGROUND
======================================== */

.background-design{
position:fixed;
inset:0;
z-index:-5;
pointer-events:none;
overflow:hidden;
background:
radial-gradient(
circle at 10% 15%,
rgba(111,174,153,.16),
transparent 25%
),
radial-gradient(
circle at 90% 85%,
rgba(242,162,58,.14),
transparent 28%
),
#fff9ed;
}

.polygon{
position:absolute;
border-radius:40px;
}

.p1{
top:-100px;
right:-90px;
width:360px;
height:360px;
background:rgba(111,174,153,.16);
clip-path:polygon(
30% 0%,
100% 0%,
100% 70%,
65% 100%,
0% 45%
);
transform:rotate(8deg);
}

.p2{
top:20%;
left:-150px;
width:330px;
height:330px;
background:rgba(242,162,58,.12);
clip-path:polygon(
0% 20%,
70% 0%,
100% 65%,
35% 100%
);
transform:rotate(-12deg);
}

.p3{
bottom:-130px;
left:15%;
width:350px;
height:350px;
background:rgba(111,174,153,.11);
clip-path:polygon(
20% 0%,
100% 35%,
75% 100%,
0% 70%
);
}

.p4{
bottom:-120px;
right:-80px;
width:330px;
height:330px;
background:rgba(242,162,58,.11);
clip-path:polygon(
0% 30%,
55% 0%,
100% 45%,
70% 100%,
15% 80%
);
}

.topographic-lines{
position:absolute;
width:700px;
height:700px;
border:1px solid rgba(7,91,70,.07);
border-radius:48% 52% 55% 45%;
transform:rotate(-18deg);
}

.line1{
top:-280px;
left:-180px;
}

.line2{
top:-245px;
left:-145px;
transform:rotate(-18deg) scale(.88);
}

.line3{
top:-210px;
left:-110px;
transform:rotate(-18deg) scale(.76);
}

.line4{
bottom:-300px;
right:-180px;
transform:rotate(28deg);
}

.line5{
bottom:-265px;
right:-145px;
transform:rotate(28deg) scale(.88);
}

.line6{
bottom:-230px;
right:-110px;
transform:rotate(28deg) scale(.76);
}

.dots-pattern{
position:absolute;
top:14%;
right:7%;
width:90px;
height:90px;
background-image:
radial-gradient(
rgba(7,91,70,.12) 1.5px,
transparent 1.5px
);
background-size:15px 15px;
opacity:.45;
}


/* ========================================
PAGE
======================================== */

.page{
width:100%;
min-height:100vh;
padding:40px 6vw 0;
display:flex;
flex-direction:column;
align-items:center;
}


/* ========================================
TOP CONTROLS
======================================== */

.top-controls{
width:100%;
max-width:1200px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:30px;
}

.reset-btn{
border:none;
cursor:pointer;
display:flex;
align-items:center;
gap:9px;
padding:11px 18px;
border-radius:50px;
font-size:12px;
font-weight:700;
transition:
transform .3s ease,
background .3s ease,
box-shadow .3s ease;
}

.reset-btn{
background:var(--green-dark);
color:white;
box-shadow:
0 8px 22px rgba(7,91,70,.15);
}

.reset-btn:hover{
transform:translateY(-3px);
}

.reset-btn:hover{
background:var(--green);
}

.back-btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
padding:11px 20px;
border:1px solid rgba(247,148,29,.35);
border-radius:50px;
background:var(--orange);
color:var(--green-dark);
box-shadow:0 8px 22px rgba(247,148,29,.22);
cursor:pointer;
text-decoration:none;
font-family:"Almarai",sans-serif;
font-size:12px;
font-weight:800;
transition:all .3s ease;
}

.back-btn:hover{
transform:translateY(-3px);
background:#ffb347;
box-shadow:0 12px 28px rgba(247,148,29,.3);
}

.back-btn i{
font-size:13px;
transition:transform .3s ease;
}

.back-btn:hover i{
transform:translateX(-4px);
}

/* ========================================
INTRO
======================================== */

.intro{
width:100%;
max-width:1000px;
text-align:center;
margin-bottom:45px;
}

.intro-label{
display:inline-flex;
align-items:center;
gap:9px;
padding:8px 17px;
border:1px solid rgba(13,112,85,.15);
border-radius:50px;
background:rgba(255,255,255,.6);
color:var(--green);
font-family:"Almarai",sans-serif;
font-size:12px;
font-weight:700;
margin-bottom:18px;
box-shadow:
0 5px 20px rgba(7,91,70,.04);
}

.intro-label i{
font-size:11px;
color:var(--orange);
}

.intro h1{
font-family:"Almarai",sans-serif;
font-size:clamp(30px,5vw,52px);
font-weight:800;
line-height:1.2;
color:var(--green-dark);
margin-bottom:12px;
}

.intro h1 span{
color:var(--orange);
}

.intro p{
max-width:620px;
margin:auto;
font-size:clamp(13px,1.5vw,16px);
line-height:1.9;
color:rgba(7,91,70,.62);
}


/* ========================================
RESPONSIVE CARDS LAYOUT
======================================== */

.cards-grid{
width:100%;
max-width:1200px;
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:stretch;
gap:24px;
}


/* ========================================
FLASH CARD
======================================== */

.flash-card{
position:relative;
flex:1 1 260px;
min-width:240px;
max-width:350px;
height:350px;
perspective:1400px;
cursor:pointer;
transition:
transform .45s ease,
opacity .45s ease;
}

.flash-card:hover{
transform:translateY(-5px);
}

.card-inner{
position:relative;
width:100%;
height:100%;
transform-style:preserve-3d;
-webkit-transform-style:preserve-3d;
transition:
transform .75s cubic-bezier(.4,0,.2,1);
}

.flash-card.flipped .card-inner{
transform:rotateY(180deg);
-webkit-transform:rotateY(180deg);
}


/* ========================================
CARD FACES
======================================== */

.card-face{
position:absolute;
inset:0;
width:100%;
height:100%;
border-radius:28px;
overflow:hidden;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
box-shadow:
0 15px 35px rgba(7,91,70,.12),
0 4px 12px rgba(7,91,70,.06);
}


/* ========================================
CARD FRONT
======================================== */

.card-front{
background:
linear-gradient(
145deg,
var(--green-dark) 0%,
var(--green) 100%
);
}

.card-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transition:
transform .7s ease,
filter .7s ease;
pointer-events:none;
}

.flash-card:hover .card-image{
transform:scale(1.06);
filter:saturate(1.08);
}

.card-overlay{
position:absolute;
inset:0;
z-index:1;
pointer-events:none;
background:
linear-gradient(
180deg,
rgba(7,91,70,.08) 0%,
rgba(7,91,70,.18) 45%,
rgba(3,42,32,.72) 100%
);
transition:background .5s ease;
}

.flash-card:hover .card-overlay{
background:
linear-gradient(
180deg,
rgba(7,91,70,.06) 0%,
rgba(7,91,70,.14) 45%,
rgba(3,42,32,.68) 100%
);
}


/* ========================================
CARD DECORATION
======================================== */

.card-decoration,
.back-decoration{
position:absolute;
inset:0;
z-index:2;
pointer-events:none;
opacity:.55;
}

.geo-line{
position:absolute;
border:1px solid rgba(255,255,255,.35);
border-radius:48% 52% 45% 55%;
}

.geo-line.one{
width:390px;
height:280px;
top:-110px;
right:-130px;
transform:rotate(18deg);
}

.geo-line.two{
width:330px;
height:235px;
top:-85px;
right:-100px;
transform:rotate(18deg);
}

.geo-line.three{
width:270px;
height:190px;
top:-60px;
right:-70px;
transform:rotate(18deg);
}

.geo-line.four{
width:340px;
height:240px;
bottom:-120px;
left:-130px;
transform:rotate(-20deg);
}

.geo-line.five{
width:285px;
height:200px;
bottom:-95px;
left:-100px;
transform:rotate(-20deg);
}


/* ========================================
FRONT CONTENT
======================================== */

.front-content{
position:absolute;
inset:0;
z-index:3;
color:white;
pointer-events:none;
direction:ltr;
}

/* ========================================
CARD NUMBER
======================================== */

.card-number{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
background:rgba(247,148,29,.92);
border:1px solid rgba(255,255,255,.3);
backdrop-filter:blur(7px);
font-family:"Almarai",sans-serif;
font-size:13px;
font-weight:800;
box-shadow:
0 7px 20px rgba(0,0,0,.1);
}

/* ========================================
FRONT SENTENCE
======================================== */

.front-content h2{
position:absolute;
top:100px;
left:50%;
transform:translateX(-50%);

width:calc(100% - 48px);
max-width:290px;
height:220px;

display:flex;
align-items:center;
justify-content:center;

margin:0;
padding:0;

font-family:"Almarai",sans-serif;
font-size:18px;
font-weight:700;
line-height:1.55;
text-align:center;

text-wrap:balance;
word-break:normal;
overflow-wrap:break-word;

text-shadow:
0 3px 15px rgba(0,0,0,.25);
}


/* ========================================
CARD ARROW
======================================== */

.card-arrow{
position:absolute;
bottom:22px;
left:22px;
z-index:4;
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(247,148,29,.88);
border:1px solid rgba(255,255,255,.25);
font-size:12px;
pointer-events:none;
transition:
transform .35s ease,
background .35s ease;
}

.flash-card:hover .card-arrow{
transform:translateX(-5px);
background:var(--orange);
}


/* ========================================
CARD BACK
======================================== */

.card-back{
transform:rotateY(180deg);
-webkit-transform:rotateY(180deg);
background:
linear-gradient(
145deg,
var(--green-dark) 0%,
var(--green) 100%
);
color:white;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:30px;
pointer-events:auto;
}

.back-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
filter:saturate(.8);
pointer-events:none;
}

.back-overlay{
position:absolute;
inset:0;
z-index:1;
pointer-events:none;
background:
linear-gradient(
180deg,
rgba(7,91,70,.84),
rgba(3,42,32,.94)
);
}


/* ========================================
ANSWER CONTENT
======================================== */

.answer-content{
position:relative;
z-index:5;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px 10px 95px;
pointer-events:auto;
}

.answer-icon{
width:58px;
height:58px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2);
margin-bottom:20px;
font-size:20px;
pointer-events:none;
}

.answer-content h3{
font-family:"Almarai",sans-serif;
font-size:clamp(25px,2.5vw,34px);
font-weight:800;
margin-bottom:12px;
color:var(--orange);
pointer-events:none;
}

.answer-content p{
font-size:15px;
line-height:1.8;
color:rgba(255,255,255,.88);
max-width:480px;
pointer-events:none;
}


/* ========================================
DONE BUTTON
======================================== */

.done-button{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:99999;
display:block;
width:auto;
min-width:120px;
padding:12px 28px;
border:none;
border-radius:50px;
background:white;
color:var(--green-dark);
font-family:"Almarai",sans-serif;
font-size:12px;
font-weight:800;
cursor:pointer;
pointer-events:auto !important;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
box-shadow:
0 8px 25px rgba(0,0,0,.18);
transition:
transform .3s ease,
box-shadow .3s ease,
background .3s ease;
}

.done-button:hover{
transform:
translateX(-50%)
translateY(-3px);
box-shadow:
0 12px 30px rgba(0,0,0,.25);
background:#fff9ed;
}

.done-button:active{
transform:
translateX(-50%)
translateY(0);
}


/* ========================================
FOCUSED CARD
======================================== */

.flash-card.focused{
position:fixed;
top:50%;
left:50%;
width:min(400px,82vw);
height:min(620px,78vh);
z-index:1000;
margin:0;
transform:
translate(-50%,-50%) !important;
cursor:default;
transition:
width .45s ease,
height .45s ease,
transform .45s ease,
opacity .45s ease;
}

.flash-card.focused:hover{
transform:
translate(-50%,-50%) !important;
}

.flash-card.focused .card-face{
box-shadow:
0 30px 80px rgba(0,0,0,.35),
0 10px 30px rgba(7,91,70,.18);
}



/* ========================================
FOCUS OVERLAY
======================================== */

.focus-overlay{
position:fixed;
inset:0;
z-index:900;
background:rgba(3,42,32,.55);
backdrop-filter:blur(4px);
opacity:0;
visibility:hidden;
pointer-events:none;
transition:
opacity .35s ease,
visibility .35s ease;
}

.focus-overlay.active{
opacity:1;
visibility:visible;
pointer-events:none;
}


/* ========================================
COMPLETED CARD
======================================== */
.flash-card.completed .done-button{
display:none !important;
}
.mobile-card-stage.mobile-completed-stage .done-button{
display:none !important;
}

.flash-card.completed{
cursor:default;
transform:none !important;
opacity:.72;
transition:
opacity .35s ease;
}


.flash-card.completed .card-image{
filter:
saturate(.65)
brightness(.82);
}

.flash-card.completed .card-overlay{
background:
linear-gradient(
180deg,
rgba(7,91,70,.25),
rgba(3,42,32,.86)
);
}

.flash-card.completed::after{
content:"✓";
position:absolute;
top:18px;
left:18px;
z-index:20;
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(255,255,255,.92);
color:var(--green);
font-size:15px;
font-weight:800;
box-shadow:
0 6px 18px rgba(0,0,0,.12);
pointer-events:none;
}


/* ========================================
POINTER EVENTS
======================================== */

.flash-card .card-image,
.flash-card .card-overlay,
.flash-card .card-decoration,
.flash-card .back-image,
.flash-card .back-overlay,
.flash-card .back-decoration{
pointer-events:none;
}




/* ========================================
TABLET
======================================== */

@media(max-width:900px){

.cards-grid{
gap:20px;
}

.flash-card{
height:330px;
}

}


/* ========================================
MOBILE
======================================== */

@media(max-width:600px){

.page{
padding:
25px
5vw
45px;
}

.top-controls{
margin-bottom:25px;
position:relative;
z-index:3000;
}

.cards-grid{
gap:18px;
}

.flash-card{
width:100%;
max-width:380px;
min-width:0;
flex:1 1 100%;
height:340px;
perspective:none !important;
-webkit-perspective:none !important;
}

/* ========================================
MOBILE ONLY:
Safari-safe answer window.
No mobile 3D flip.
======================================== */

.flash-card.mobile-stage-active > .card-inner{
visibility:hidden !important;
opacity:0 !important;
pointer-events:none !important;
}

.flash-card.mobile-stage-active{
z-index:1099 !important;
}

.mobile-card-stage{
position:fixed !important;
top:50% !important;
left:50% !important;
width:min(340px,82vw) !important;
height:280px !important;
transform:translate(-50%,-50%) !important;
z-index:2000 !important;
isolation:isolate !important;
pointer-events:auto !important;
}

.mobile-card-stage.mobile-completed-stage{
position:absolute !important;
top:0 !important;
left:0 !important;
width:100% !important;
height:100% !important;
transform:none !important;
z-index:30 !important;
}

.mobile-card-stage.mobile-completed-stage .mobile-card-back{
visibility:visible !important;
opacity:1 !important;
pointer-events:none !important;
}

.mobile-card-stage .mobile-card-front{
position:absolute !important;
inset:0 !important;
width:100% !important;
height:100% !important;
border-radius:28px !important;
overflow:hidden !important;
transform:none !important;
-webkit-transform:none !important;
visibility:visible !important;
opacity:1 !important;
z-index:1 !important;
}

.mobile-card-stage .mobile-card-back{
position:absolute !important;
inset:0 !important;
width:100% !important;
height:100% !important;
border-radius:28px !important;
overflow:hidden !important;
transform:none !important;
-webkit-transform:none !important;
visibility:visible !important;
opacity:1 !important;
z-index:2 !important;
display:flex !important;
}

/* Hide the answer initially. */
.mobile-card-stage .mobile-card-back{
visibility:hidden !important;
opacity:0 !important;
pointer-events:none !important;
}

/* Answer window: same visual language as the card. */
.mobile-card-stage.show-answer .mobile-card-back{
visibility:visible !important;
opacity:1 !important;
pointer-events:auto !important;
}

/* Keep the answer content centered inside the mobile window. */
.mobile-card-stage .mobile-card-back .answer-content{
width:100% !important;
height:100% !important;
min-height:0 !important;
padding:20px 10px 72px !important;
}

/* The original question card is fully covered while the answer window exists. */
.mobile-card-stage + .mobile-face-barrier{
display:none !important;
}

.flash-card.focused{
position:fixed !important;
top:50% !important;
left:50% !important;
width:min(340px,82vw) !important;
height:280px !important;
max-width:340px !important;
max-height:280px !important;
margin:0 !important;
transform:translate(-50%,-50%) !important;
transition:transform .45s ease, opacity .45s ease !important;
}

.flash-card.focused:hover{
transform:translate(-50%,-50%) !important;
}

.reset-btn{
padding:10px 14px;
font-size:11px;
}

}
/* ========================================
FOOTER
======================================== */

.site-footer{
width:100vw;
margin-left:calc(50% - 50vw);
margin-right:calc(50% - 50vw);
margin-top:90px;
padding:34px 6vw 36px;
background:var(--green-dark);
color:rgba(255,255,255,.78);
border-top:1px solid rgba(255,255,255,.08);
box-shadow:0 -8px 25px rgba(7,91,70,.08);
flex-shrink:0;
}

.footer-inner{
width:min(1200px,88vw);
margin:0 auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
font-family:"Almarai",sans-serif;
font-size:10px;
font-weight:600;
line-height:1.6;
text-align:center;
}

.footer-brand{
color:#f2a23a;
font-size:13px;
font-weight:800;
letter-spacing:.3px;
}

.footer-center{
color:rgba(255,255,255,.9);
font-size:11px;
font-weight:700;
}

.footer-designed{
color:rgba(255,255,255,.68);
font-size:10px;
}

.footer-right{
color:rgba(255,255,255,.62);
font-size:9px;
}

@media(max-width:600px){

.site-footer{
margin-top:65px;
padding:24px 5vw 26px;
}

.footer-inner{
width:90vw;
gap:6px;
}

.footer-brand{
font-size:11px;
}

.footer-center{
font-size:10px;
}

.footer-designed{
font-size:9px;
}

.footer-right{
font-size:8.5px;
}

}

/* ========================================
ANSWER COVER
======================================== */

.answer-cover-wrap{
position:relative;
width:100%;
min-height:170px;
display:flex;
align-items:center;
justify-content:center;
margin-top:15px;
}

.answer-hidden{
width:100%;
min-height:150px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.answer-cover{
position:absolute;
inset:0;
z-index:20;
border:none;
border-radius:20px;
background:var(--cream);
color:var(--green-dark);
font-family:"Almarai",sans-serif;
font-size:18px;
font-weight:800;
cursor:pointer;
box-shadow:

<body>
<div class="background-design">
<div class="polygon p1"></div>
<div class="polygon p2"></div>
<div class="polygon p3"></div>
<div class="polygon p4"></div>

<div class="topographic-lines line4"></div>

ReSet

</div>
<h1>Back On Track</h1>
<p>expanding your vocabulary, and knowing how to make meaning of an unfamilar word by using the context given.</p>
</section>
<section class="cards-grid" id="cardsGrid" aria-label="Vocabulary flash cards"></section>

<!-- ========================================
JAVASCRIPT
======================================== -->
<script>
"use strict";

/* =========================================
1. EDIT ALL CARD CONTENT HERE
Add, remove, or edit cards in this array.
========================================= */
const CARDS = [
{
question: "The students are organizing their courses by EXTRAPOLATE what they’ve heard or experienced with different professors and timings, so it can match their preference.",
word: "Extrapolate",
meaning: "To form an opinion based on past experiences or known facts."
},
{
question: "Students are advised to REVAMP their schedule to fit within their academic routine.",
word: "Revamp",
meaning: "To modify or to change."
},
{
question: "It is common for students to expect UNFORESEEN changes in their schedule within the first week into the year.",
word: "Unforeseen",
meaning: "Not expected."
},
{
question: "After spending a month on campus, I’m starting to HARMONIZE with the environment more.",
word: "Harmonize",
meaning: "To form a comfortable and pleasing relationship."
}
];

/* =========================================
2. ELEMENTS & SAVED PROGRESS
========================================= */
const STORAGE_KEY = "cards3CompletedCards";
const STATE_KEY = "cards3State";
const cardsGrid = document.getElementById("cardsGrid");
const focusOverlay = document.getElementById("focusOverlay");
const resetButton = document.getElementById("resetButton");

function isMobile() {
return window.matchMedia("(max-width: 600px)").matches;
}

function readJSON(key, fallback) {
try {
const value = JSON.parse(localStorage.getItem(key));
return value ?? fallback;
} catch (error) {
return fallback;
}
}

let completedCards = readJSON(STORAGE_KEY, []);
if (!Array.isArray(completedCards)) completedCards = [];
completedCards = completedCards.filter(index => Number.isInteger(index) && index >= 0 && index < CARDS.length);
let savedState = readJSON(STATE_KEY, {});
if (!savedState || typeof savedState !== "object" || Array.isArray(savedState)) savedState = {};
let activeCard = null;

function saveProgress() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(completedCards));
localStorage.setItem(STATE_KEY, JSON.stringify(savedState));
} catch (error) {
// The activity still works if browser storage is unavailable.
}
}

function saveCardState(card) {
if (!card) return;
const index = Number(card.dataset.index);
savedState[index] = {
flipped: card.classList.contains("flipped"),
completed: card.classList.contains("completed")
};
saveProgress();
}

/* =========================================
3. BUILD CARDS FROM THE CARDS ARRAY
========================================= */
function createCard(cardData, index) {
const card = document.createElement("article");
card.className = "flash-card";
card.dataset.index = String(index);
card.innerHTML = `
<div class="card-inner">
<div class="card-face card-front">
<div class="card-overlay"></div>
<div class="card-decoration" aria-hidden="true">
<div class="geo-line one"></div>
<div class="geo-line two"></div>
<div class="geo-line three"></div>
<div class="geo-line four"></div>
<div class="geo-line five"></div>
</div>
<div class="front-content">
<div class="card-number">${String(index + 1).padStart(2, "0")}</div>
<h2 class="card-question"></h2>
</div>
<div class="card-arrow" aria-hidden="true">
<i class="fa-solid fa-arrow-left"></i>
</div>
</div>
<div class="card-face card-back">
<div class="back-overlay"></div>
<div class="back-decoration" aria-hidden="true">
<div class="geo-line one"></div>
<div class="geo-line two"></div>
<div class="geo-line three"></div>
<div class="geo-line four"></div>
<div class="geo-line five"></div>
</div>
<div class="answer-content">
<h3 class="answer-word"></h3>
<p class="answer-meaning"></p>
<button type="button" class="done-button">DONE</button>
</div>
</div>
</div>`;

// Insert user-editable text safely without interpreting it as HTML.
card.querySelector(".card-question").textContent = cardData.question;
card.querySelector(".answer-word").textContent = cardData.word;
card.querySelector(".answer-meaning").textContent = cardData.meaning;

if (completedCards.includes(index)) card.classList.add("completed", "flipped");
return card;
}

function renderCards() {
const fragment = document.createDocumentFragment();
CARDS.forEach((cardData, index) => fragment.appendChild(createCard(cardData, index)));
cardsGrid.replaceChildren(fragment);
}


/* =========================================
4. MOBILE ANSWER STAGE
The cloned stage is placed under body, so DONE
locates its original card using data-card-index.
========================================= */
function getMobileStage(index) {
return document.querySelector(`.mobile-card-stage[data-card-index="${index}"]`);
}

function createMobileStage(card) {
if (!card || !isMobile()) return null;
let stage = getMobileStage(card.dataset.index);
if (stage) return stage;

const front = card.querySelector(".card-front");
const back = card.querySelector(".card-back");
if (!front || !back) return null;

stage = document.createElement("div");
stage.className = "mobile-card-stage";
stage.dataset.cardIndex = card.dataset.index;

const frontClone = front.cloneNode(true);
frontClone.classList.add("mobile-card-front");
const backClone = back.cloneNode(true);
backClone.classList.add("mobile-card-back");
backClone.style.transform = "none";
backClone.style.webkitTransform = "none";

stage.append(frontClone, backClone);
document.body.appendChild(stage);
card.classList.add("mobile-stage-active");
return stage;
}

function destroyMobileStage(card) {
if (!card) return;
const stage = getMobileStage(card.dataset.index);
if (stage) stage.remove();
card.classList.remove("mobile-stage-active", "mobile-answer");
}

/* =========================================
5. OPEN CARD
========================================= */
function openCard(card) {
if (!card || card.classList.contains("completed") || card.classList.contains("focused")) return;
if (activeCard) return;
activeCard = card;
card.classList.add("focused");
focusOverlay.classList.add("active");
document.body.style.overflow = "hidden";

if (isMobile()) {
const stage = createMobileStage(card);
if (stage) requestAnimationFrame(() => stage.classList.add("show-answer"));
card.classList.add("mobile-answer");
} else {
card.classList.add("flipped");
}
saveCardState(card);
}

/* =========================================
6. DONE
========================================= */
function completeCard(card) {
if (!card || card.classList.contains("completed")) return;
const index = Number(card.dataset.index);
if (!Number.isInteger(index)) return;

if (!completedCards.includes(index)) completedCards.push(index);
card.classList.add("completed");
card.classList.remove("focused");
card.classList.add("flipped");

if (isMobile()) {
// The stage is outside the card while open; retrieve it by its index.
const stage = getMobileStage(index);
if (stage) {
stage.classList.remove("show-answer");
stage.classList.add("mobile-completed-stage");
card.appendChild(stage);
requestAnimationFrame(() => stage.classList.add("show-answer"));
}
card.classList.add("mobile-answer");
}

activeCard = null;
focusOverlay.classList.remove("active");
document.body.style.overflow = "";
saveCardState(card);
}

/* =========================================
7. EVENTS
========================================= */
cardsGrid.addEventListener("click", event => {
const doneButton = event.target.closest(".done-button");
if (doneButton) return; // Handled by the document listener below.
const card = event.target.closest(".flash-card");
if (card) openCard(card);
});

// Capture works for both original buttons and buttons inside the mobile clone.
document.addEventListener("click", event => {
const doneButton = event.target.closest(".done-button");
if (!doneButton) return;
event.preventDefault();
event.stopPropagation();

let card = doneButton.closest(".flash-card");
if (!card) {
const stage = doneButton.closest(".mobile-card-stage");
if (stage) card = cardsGrid.querySelector(`.flash-card[data-index="${stage.dataset.cardIndex}"]`);
}
if (card) completeCard(card);
}, true);

/* =========================================
8. RESET & RESTORE
========================================= */
function resetCards() {
completedCards = [];
savedState = {};
activeCard = null;
try {
localStorage.removeItem(STORAGE_KEY);
localStorage.removeItem(STATE_KEY);
} catch (error) {}

cardsGrid.querySelectorAll(".flash-card").forEach(card => {
destroyMobileStage(card);
card.classList.remove("completed", "focused", "flipped", "mobile-answer");
});
focusOverlay.classList.remove("active");
document.body.style.overflow = "";
}

function restoreCardStates() {
cardsGrid.querySelectorAll(".flash-card").forEach(card => {
const index = Number(card.dataset.index);
const state = savedState[index] || {};
if (completedCards.includes(index) || state.completed) {
card.classList.add("completed", "flipped");
if (!completedCards.includes(index)) completedCards.push(index);
} else if (!isMobile() && state.flipped) {
card.classList.add("flipped");
}
});
saveProgress();
}

resetButton.addEventListener("click", resetCards);
window.addEventListener("resize", () => {
if (!isMobile()) {
cardsGrid.querySelectorAll(".flash-card").forEach(card => destroyMobileStage(card));
}
});

renderCards();
restoreCardStates();
</script>
</body>
</html>
