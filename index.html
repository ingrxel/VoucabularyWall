<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speaking Center Vocabulary WALL | Saudi Geology Club</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* =========================
1. COLORS & GLOBAL RULES
========================== */
:root {
--cream: #fff9ed;
--cream-dark: #f3eadb;
--green-dark: #075b46;
--green: #0d7055;
--green-soft: #6fae99;
--gold: #f2a23a;
--brown: #c58a4a;
--orange: #f7941d;
--blue: #2e6b62;
--white: #ffffff;

--card-radius: 28px;
--card-shadow: 0 15px 35px rgba(7, 91, 70, .12),
0 4px 12px rgba(7, 91, 70, .06);
}

*,
*::before,
*::after {
box-sizing: border-box;
}

html {
min-height: 100%;
scroll-behavior: smooth;
}

body {
min-width: 320px;
min-height: 100vh;
margin: 0;
overflow-x: hidden;
background: var(--cream);
color: var(--green-dark);
font-family: "Tajawal", sans-serif;
}

a {
color: inherit;
text-decoration: none;
}

a:focus-visible {
outline: 3px solid var(--orange);
outline-offset: 5px;
}

/* =========================
2. DECORATIVE BACKGROUND
========================== */
.background-design {
position: fixed;
inset: 0;
z-index: -1;
overflow: hidden;
pointer-events: none;
background:
radial-gradient(circle at 10% 15%, rgba(111,174,153,.16), transparent 25%),
radial-gradient(circle at 90% 85%, rgba(242,162,58,.14), transparent 28%),
var(--cream);
}

.polygon {
position: absolute;
border-radius: 40px;
}

.p1 {
top: -100px;
right: -90px;
width: 360px;
height: 360px;
background: rgba(111,174,153,.16);
clip-path: polygon(30% 0, 100% 0, 100% 70%, 65% 100%, 0 45%);
transform: rotate(8deg);
}

.p2 {
top: 20%;
left: -150px;
width: 330px;
height: 330px;
background: rgba(242,162,58,.12);
clip-path: polygon(0 20%, 70% 0, 100% 65%, 35% 100%);
transform: rotate(-12deg);
}

.p3 {
bottom: -130px;
left: 15%;
width: 350px;
height: 350px;
background: rgba(111,174,153,.11);
clip-path: polygon(20% 0, 100% 35%, 75% 100%, 0 70%);
}

.p4 {
right: -80px;
bottom: -120px;
width: 330px;
height: 330px;
background: rgba(242,162,58,.11);
clip-path: polygon(0 30%, 55% 0, 100% 45%, 70% 100%, 15% 80%);
}

.topographic-lines {
position: absolute;
width: 700px;
height: 700px;
border: 1px solid rgba(7,91,70,.07);
border-radius: 48% 52% 55% 45%;
}

.line1 { top: -280px; left: -180px; transform: rotate(-18deg); }
.line2 { top: -245px; left: -145px; transform: rotate(-18deg) scale(.88); }
.line3 { top: -210px; left: -110px; transform: rotate(-18deg) scale(.76); }
.line4 { right: -180px; bottom: -300px; transform: rotate(28deg); }
.line5 { right: -145px; bottom: -265px; transform: rotate(28deg) scale(.88); }
.line6 { right: -110px; bottom: -230px; transform: rotate(28deg) scale(.76); }

.dots-pattern {
position: absolute;
top: 14%;
right: 7%;
width: 90px;
height: 90px;
opacity: .45;
background-image: radial-gradient(rgba(7,91,70,.12) 1.5px, transparent 1.5px);
background-size: 15px 15px;
}

/* =========================
3. PAGE & INTRO
========================== */
.page {
display: flex;
min-height: 100vh;
flex-direction: column;
align-items: center;
padding: 55px 6vw 0;
}

.intro {
width: 100%;
margin-bottom: 55px;
text-align: center;
}

.intro-label {
display: inline-flex;
align-items: center;
gap: 9px;
margin-bottom: 18px;
padding: 8px 17px;
border: 1px solid rgba(13,112,85,.15);
border-radius: 50px;
background: rgba(255,255,255,.6);
color: var(--green);
box-shadow: 0 5px 20px rgba(7,91,70,.04);
font-family: "Almarai", sans-serif;
font-size: 12px;
font-weight: 700;
}

.intro-label i {
color: var(--orange);
font-size: 11px;
}

.intro h1 {
margin: 0 0 12px;
color: var(--green-dark);
font-family: "Almarai", sans-serif;
font-size: clamp(32px, 5vw, 52px);
font-weight: 800;
line-height: 1.2;
}

.intro p {
max-width: 620px;
margin: 0 auto;
color: rgba(7,91,70,.72);
font-size: clamp(13px, 1.5vw, 16px);
line-height: 1.9;
}

/* =========================
4. NAVIGATION CARDS
========================== */
.pages-grid {
display: flex;
width: 100%;
max-width: 1100px;
flex-wrap: wrap;
justify-content: center;
gap: 22px;
margin: 0 auto;
}

.page-card {
position: relative;
display: flex;
width: 235px;
min-height: 175px;
flex: 1 1 220px;
max-width: 255px;
align-items: center;
justify-content: center;
overflow: hidden;
border-radius: var(--card-radius);
background: linear-gradient(145deg, var(--green-dark), var(--green));
box-shadow: var(--card-shadow);
color: var(--white);
font-family: "Almarai", sans-serif;
font-size: clamp(16px, 1.7vw, 19px);
font-weight: 800;
text-align: center;
transition: transform .35s ease, box-shadow .35s ease;
isolation: isolate;
}

.page-card:hover {
transform: translateY(-6px);
box-shadow: 0 20px 40px rgba(7,91,70,.2);
}

.page-card span {
position: relative;
z-index: 3;
padding: 25px;
text-shadow: 0 3px 15px rgba(0,0,0,.2);
}

.card-decoration {
position: absolute;
inset: 0;
z-index: 2;
overflow: hidden;
opacity: .55;
pointer-events: none;
}

.geo-line {
position: absolute;
border: 1px solid rgba(255,255,255,.35);
border-radius: 48% 52% 45% 55%;
pointer-events: none;
}

.geo-line.one {
top: -110px;
right: -130px;
width: 390px;
height: 280px;
transform: rotate(18deg);
}

.geo-line.two {
top: -85px;
right: -100px;
width: 330px;
height: 235px;
transform: rotate(18deg);
}

.geo-line.three {
top: -60px;
right: -70px;
width: 270px;
height: 190px;
transform: rotate(18deg);
}

.geo-line.four {
bottom: -120px;
left: -130px;
width: 340px;
height: 240px;
transform: rotate(-20deg);
}

.geo-line.five {
bottom: -95px;
left: -100px;
width: 285px;
height: 200px;
transform: rotate(-20deg);
}

/* =========================
5. FOOTER
========================== */
.site-footer {
width: calc(100% + 12vw);
align-self: stretch;
margin-left: -6vw;
margin-right: -6vw;
margin-top: auto;
padding: 34px 6vw 36px;
background: var(--green-dark);
color: rgba(255,255,255,.78);
border-top: 1px solid rgba(255,255,255,.08);
box-shadow: 0 -8px 25px rgba(7,91,70,.08);
flex-shrink: 0;
}

.footer-inner {
display: flex;
width: min(1200px, 88vw);
flex-direction: column;
align-items: center;
gap: 8px;
margin: 0 auto;
font-family: "Almarai", sans-serif;
font-size: 10px;
font-weight: 600;
line-height: 1.6;
text-align: center;
}

.footer-brand {
color: var(--gold);
font-size: 13px;
font-weight: 800;
letter-spacing: .3px;
}

.footer-center {
color: rgba(255,255,255,.9);
font-size: 11px;
font-weight: 700;
}

.footer-designed { color: rgba(255,255,255,.68); font-size: 10px; }
.footer-right { color: rgba(255,255,255,.62); font-size: 9px; }

/* =========================
6. RESPONSIVE LAYOUT
========================== */
@media (max-width: 650px) {
.page {
padding: 40px 5vw 0;
}

.intro {
margin-bottom: 38px;
}

.pages-grid {
gap: 16px;
}

.page-card {
width: 100%;
min-height: 145px;
max-width: 420px;
flex: 1 1 100%;
}

.site-footer {
margin-top: 65px;
padding: 24px 5vw 26px;
}

.footer-inner {
width: 90vw;
gap: 6px;
}

.footer-brand { font-size: 11px; }
.footer-center { font-size: 10px; }
.footer-designed { font-size: 9px; }
.footer-right { font-size: 8.5px; }
}

@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
scroll-behavior: auto !important;
transition-duration: .01ms !important;
animation-duration: .01ms !important;
}
}
</style>
</head>
